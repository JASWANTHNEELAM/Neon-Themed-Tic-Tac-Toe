<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neon Radium Tic Tac Toe — Play</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="bg-neon">
  <main class="page center">
    <h1 class="neon-title">Neon Radium Tic Tac Toe</h1>

    <p class="chip">
      Mode: <strong id="game-mode-display"></strong>
      <span id="ai-level-display"></span>
    </p>

    <p class="chip">
      Turn: <span id="turn-indicator" class="turn"></span>
    </p>
    <div id="board" class="board">
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <button class="cell"></button>
      <div id="strike"></div>
    </div>

    <div class="row gap center" style="margin-top: 30px;">
      <button class="neon-btn" id="restart">Restart</button>
      <a class="neon-link" id="back-link" href="#">← Back to Setup</a>
    </div>

    <div id="popup" class="popup hidden">
      <div class="popup-content">
        <button id="popup-close" class="popup-close">&times;</button>
        <p id="popup-message"></p>
      </div>
    </div>
  </main>

  <script>
    // Read the parameters from the URL instead of Python
    const urlParams = new URLSearchParams(window.location.search);
    const MODE = urlParams.get('mode') || 'PvP';
    const LEVEL = urlParams.get('ai_level') || '';
    const P1SYMBOL = urlParams.get('p1') || 'X';
    const P2SYMBOL = urlParams.get('p2') || 'O';

    // Update the UI with the selected parameters
    document.getElementById('game-mode-display').innerText = MODE;
    if (LEVEL) {
        document.getElementById('ai-level-display').innerHTML = ` • AI: <strong>${LEVEL}</strong>`;
    }
    document.getElementById('back-link').href = `setup.html?mode=${MODE}`;
  </script>
  <script src="script.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker Registered!'))
        .catch(err => console.log('Service Worker Failed: ', err));
    });
  }
</script>
</body>
</html>
