<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neon Radium Tic Tac Toe — Setup</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00f5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="bg-neon">
  <main class="page center">
    <h1 class="neon-title">Game Setup</h1>
    <section class="card neon-panel">
      <p class="chip">Mode: <strong id="mode-display"></strong></p>

      <div id="ai-settings" class="group" style="display: none;">
        <label class="label">AI Difficulty</label>
        <div class="row gap">
          <button class="toggle neon-btn active" data-value="easy">Easy</button>
          <button class="toggle neon-btn" data-value="normal">Normal</button>
          <button class="toggle neon-btn" data-value="hard">Hard</button>
        </div>
      </div>

      <div class="group">
        <label class="label">Player 1 Symbol</label>
        <div class="symbol-grid" id="p1-grid"></div>
      </div>

      <div class="group">
        <label class="label" id="p2-label">Player 2 Symbol</label>
        <div class="symbol-grid" id="p2-grid"></div>
      </div>

      <div class="row gap center">
        <a class="neon-link" href="index.html">← Back</a>
        <button id="start-btn" class="neon-btn">Start Game</button>
      </div>
    </section>
  </main>

  <script>
    // Grab mode from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'PvP';
    
    document.getElementById('mode-display').innerText = mode;
    if (mode === 'PvC') {
        document.getElementById('ai-settings').style.display = 'block';
        document.getElementById('p2-label').innerText = 'CPU Symbol';
    }

    // Move the symbols list from Python to JavaScript
    const SYMBOLS = ["X", "O", "⭐", "❤️", "🐱", "⚡", "🍀", "🌀", "🔥", "🌙"];
    const p1Grid = document.getElementById("p1-grid");
    const p2Grid = document.getElementById("p2-grid");
    
    let p1 = "X";
    let p2 = "O";
    let aiLevel = "easy";

    // Build the grid buttons dynamically
    function buildGrid(container) {
        SYMBOLS.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'symbol neon-chip';
            btn.dataset.s = s;
            btn.innerText = s;
            container.appendChild(btn);
        });
    }
    buildGrid(p1Grid);
    buildGrid(p2Grid);

    // Difficulty toggles
    const toggles = document.querySelectorAll(".toggle");
    toggles.forEach(btn => btn.addEventListener("click", () => {
      toggles.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      aiLevel = btn.dataset.value;
    }));

    function updateActive(grid, symbol) {
      [...grid.querySelectorAll(".symbol")].forEach(b => {
        b.classList.toggle("active", b.dataset.s === symbol);
        b.disabled = false;
        if ((grid === p1Grid && b.dataset.s === p2) ||
            (grid === p2Grid && b.dataset.s === p1)) {
          b.disabled = true;
        }
      });
    }

    p1Grid.addEventListener("click", (e) => {
      if (!e.target.closest(".symbol")) return;
      p1 = e.target.dataset.s;
      if (p1 === p2) p2 = [...p2Grid.querySelectorAll(".symbol")].find(b => b.dataset.s !== p1).dataset.s;
      updateActive(p1Grid, p1);
      updateActive(p2Grid, p2);
    });

    p2Grid.addEventListener("click", (e) => {
      if (!e.target.closest(".symbol")) return;
      p2 = e.target.dataset.s;
      if (p1 === p2) p1 = [...p1Grid.querySelectorAll(".symbol")].find(b => b.dataset.s !== p2).dataset.s;
      updateActive(p1Grid, p1);
      updateActive(p2Grid, p2);
    });

    updateActive(p1Grid, p1);
    updateActive(p2Grid, p2);

    document.getElementById("start-btn").addEventListener("click", () => {
      const params = new URLSearchParams({
        mode,
        p1,
        p2,
        ...(mode === "PvC" ? { ai_level: aiLevel } : {})
      });
      // Link to the game HTML file directly
      window.location.href = "game.html?" + params.toString();
    });
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker Registered!'))
        .catch(err => console.log('Service Worker Failed: ', err));
    });
  }
</script>
</body>
</html>
